apiVersion: v2
name: "helm-chart"
description: "Helm chart blueprint with verbatim {{ .Values.x }} preservation"
version: "2.0.0"
tags: ["helm", "k8s"]

variables:
  - name: project_name
    description: "Name of the chart"
    type: string
    required: true
    validate: "^[a-z][a-z0-9-]*$"

  - name: app_image
    description: "Default container image"
    type: string
    default: "nginx"

rename:
  "${project_name}/": "."
