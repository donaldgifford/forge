apiVersion: v2
name: "go-api"
description: "Go API service with HTTP and optional gRPC"
version: "2.0.0"
tags: ["go", "api", "grpc"]

variables:
  - name: project_name
    description: "Name of the project"
    type: string
    required: true
    validate: "^[a-z][a-z0-9-]*$"

  - name: go_module
    description: "Go module path"
    type: string
    default: "github.com/example/v2-api"

  - name: use_grpc
    description: "Include gRPC support?"
    type: bool
    default: "false"

conditions:
  - when: "!use_grpc"
    exclude:
      - "proto/"

rename:
  "${project_name}/": "."
